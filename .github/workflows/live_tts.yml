name: Live TTS check

on:
  push:
    branches: ['claude/**']
    paths:
      - 'research/live_request.txt'
      - 'research/live_tts.py'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Live time to shot
        run: python research/live_tts.py
