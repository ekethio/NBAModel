name: NBA Totals Bets

on:
  # Twice a day: late morning ET posts the day's bets, early evening ET fills in lines and grades
  schedule:
    - cron: '23 15 * * *'
    - cron: '17 21 * * *'
  # Run automatically whenever the picks script or this workflow changes
  push:
    paths:
      - 'nba_picks.py'
      - '.github/workflows/nba_picks.yml'
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: nba-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run picks script
        run: python nba_picks.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/tempo_games.json
          git diff --staged --quiet && exit 0
          git commit -m "Update NBA bets $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
