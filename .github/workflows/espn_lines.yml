name: ESPN Lines (one-off)

on:
  push:
    branches: ['claude/**']
    paths:
      - 'research/espn_lines.py'
      - 'research/espn_lines_limit.txt'
      - '.github/workflows/espn_lines.yml'
  workflow_dispatch:

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch lines
        run: python research/espn_lines.py $(cat research/espn_lines_limit.txt 2>/dev/null)
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/espn_lines.csv
          git diff --staged --quiet && exit 0
          git commit -m "Add ESPN opening and closing totals"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
